<!doctype html><html lang="en"><meta charset="utf-8"><title>Tic-tac-toe</title>
<style>
body{font:16px system-ui;color:#e2e8f0;background:#172033;margin:0;padding:1rem}
main{max-width:20rem;margin:auto;display:grid;gap:.8rem;text-align:center}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
button{font:inherit;min-height:2.5rem;color:inherit;background:#334155;border:1px solid #64748b;border-radius:.3rem;cursor:pointer}
#board button{aspect-ratio:1;font-size:1.4rem}
</style><main><output id="status" aria-live="polite">X’s turn</output><div id="board"></div><button id="restart" type="button">Restart</button></main>
<script>
const board = document.getElementById('board');
const statusDisplay = document.getElementById('status');
const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let marks, turn, finished;
const cells = Array.from({length:9}, (_, i) => {
  const cell = document.createElement('button');
  cell.type = 'button';
  cell.addEventListener('click', () => {
    if (finished || marks[i]) return;
    marks[i] = turn; cell.textContent = turn;
    if (lines.some(line => line.every(index => marks[index] === turn))) {
      statusDisplay.textContent = turn + ' wins'; finished = true;
    } else if (marks.every(Boolean)) {
      statusDisplay.textContent = 'Draw'; finished = true;
    } else {
      turn = turn === 'X' ? 'O' : 'X'; statusDisplay.textContent = turn + '’s turn';
    }
  });
  board.append(cell); return cell;
});
function restart() {
  marks = Array(9).fill(''); turn = 'X'; finished = false;
  cells.forEach((cell, i) => { cell.textContent = String(i+1); });
  statusDisplay.textContent = 'X’s turn';
}
document.getElementById('restart').addEventListener('click', restart);
restart();
</script></html>
