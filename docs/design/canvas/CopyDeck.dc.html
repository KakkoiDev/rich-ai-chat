<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copy deck EN / JA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/232ffe54ef71b53181f68fc03eeda221">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400..700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#000}a:hover{color:#595959}
.cd{display:grid;grid-template-columns:150px 230px 1fr 1fr;gap:16px;padding:7px 0;border-bottom:1px solid #d4d4d4;font-size:13px;line-height:1.5}
.cd.h{font-weight:600;border-bottom:1px solid #000;padding-top:0}
.cd code{font-size:12px;color:#595959}
.ar{font:600 12px/1.4 Inter;color:#595959}
</style>
</helmet>
<div class="k" style="width: 1280px; height: 3100px; padding: 64px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 8px">
<p class="t-label t-muted" style="margin: 0">Hand-back 5 · copy-deck.json</p>
<h1 class="t-h1">Copy deck</h1>
<p class="t-small t-muted" style="margin: 0; max-width: 860px">Every status and error string, in plain words. {n}, {s}, {time} and {model} are filled in by the system. Japanese uses polite form for instructions, plain noun phrases for status.</p>
</header>
<div role="table" aria-label="Copy deck">
<div class="cd h" role="row"><span role="columnheader">Area</span><span role="columnheader">Key</span><span role="columnheader">English</span><span role="columnheader" lang="ja">日本語</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="20">
<div class="cd" role="row"><span class="ar" role="cell">{{r.area}}</span><code role="cell">{{r.id}}</code><span role="cell">{{r.en}}</span><span role="cell" lang="ja" style="font-family: 'Noto Sans JP', sans-serif">{{r.ja}}</span></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":3100}}'>
class Component extends DCLogic {
renderVals() {
var R = [
["Shell","shell.newChat","New chat","新しいチャット"],

["Shell","shell.welcome.title","What shall we make?","何をつくりますか？"],
["Shell","shell.welcome.body","Ask a question, or describe a game or tool and play it here.","質問するか、ゲームや道具を説明すると、ここで遊べます。"],
["Composer","composer.placeholder","Ask anything, or describe an app to build","質問や作りたいアプリを入力"],
["Composer","composer.privacy.local","Runs on this Mac. Web search sends your search words online.","このMacで動きます。Web検索では検索語が外部に送信されます。"],
["Composer","composer.privacy.hosted","Hosted: your messages and files are sent to {model}.","外部サービス：メッセージとファイルは{model}に送信されます。"],
["Composer","composer.model.local","On this Mac","このMacで実行"],
["Composer","composer.model.hosted","Hosted: text leaves this device","外部：テキストが端末の外に送られます"],
["Composer","composer.model.locked","Set by your teacher","先生が設定しています"],
["Composer","composer.attach.limit","Attach · {n} of 3","添付 · {n}/3"],
["Composer","composer.attach.tooBig","{file} is {size}. Files can be up to 12 KB.","{file}は{size}です。12 KBまでのファイルを添付できます。"],

["Composer","composer.answering","Answering · {time}","回答中 · {time}"],

["Apps","app.install.separate","It becomes its own app. It opens from its own address and keeps its own data, separate from this chat.","独立したアプリになります。専用のアドレスで開き、データもチャットとは別に保存されます。"],

["Connection","conn.loadingModel","Loading {model}…","{model}を読み込んでいます…"],
["Connection","conn.loadingModel.help","The first message after a while takes up to a minute. Your message will go as soon as it's ready.","しばらくぶりの最初のメッセージは、最大1分ほどかかります。準備ができしだい送信します。"],

["Errors","err.storageFull","Couldn't save this chat. Storage on this phone is full.","チャットを保存できませんでした。この端末の保存容量がいっぱいです。"],
["Errors","err.tryAgain","Try again","もう一度試す"],
["Errors","err.details","Details for your teacher","先生向けの詳細"]
];
return { rows: R.map(function (x) { return { area: x[0], id: x[1], en: x[2], ja: x[3] }; }) };
}
}
</script>
</body>
</html>
