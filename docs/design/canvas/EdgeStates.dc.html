<style>

<div class="body"><div class="you">Chart Tokyo's rainfall by month</div><p style="margin: 0">Here is Tokyo's average rainfall. October is the wettest month…</p><p class="t-small bad" style="margin: 0; display: flex; gap: 6px; align-items: center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>Not saved on this phone</p></div>

<strong>Couldn't save this chat.</strong>

<div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn btn-primary">Free up space</button><button class="btn">Try again</button></div>
</div>
<div style="height: 34px; flex: none"></div></div>
</figure>

<figure style="margin: 0"><figcaption class="cap">Error · always a way out</figcaption>

<div class="body"><div class="you">Make a times-tables game</div>
<div style="border: 2px solid #c4161c; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span class="status bad" style="font-weight: 600"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>Something went wrong on the Mac</span>

<details style="font-size: 13px"><summary style="min-height: 44px; display: flex; align-items: center; cursor: pointer; text-decoration: underline">Details for your teacher</summary><code style="display: block; background: #f2f2f2; padding: 8px; font-size: 12px">model_exit 137 · out of memory · 14:12:03</code></details>
</div></div>
<div class="cmp"><span class="t-muted" style="flex: 1">Ask anything</span><button class="btn btn-primary btn-icon" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
<div style="height: 34px; flex: none"></div></div>
</figure>

<figure style="margin: 0"><figcaption class="cap">Empty · saved apps · loading history</figcaption>
<div class="ph"><div style="height: 47px; flex: none"></div>
<header class="hd"><a class="btn btn-ghost btn-icon" href="#" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a><h2>Saved apps</h2><span class="menu"></span></header>
<div class="body" style="justify-content: center; align-items: flex-start; gap: 12px">

<a class="btn btn-primary" href="#">Start a chat</a>
</div>
<div style="border-top: 1px solid #d4d4d4; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px" aria-busy="true" aria-label="Loading chats">

<div class="body" style="padding: 12px"><div style="border: 1px solid #000; display: flex; flex-direction: column"><div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 8px 8px 12px; gap: 8px"><strong style="font-size: 15px">Solar system quiz</strong><span class="badge">v2</span></div><div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 8px 8px"><button class="btn btn-primary" style="flex: 1 1 100%">Full screen</button><button class="btn" style="flex: 1">Restart</button><button class="btn" style="flex: 1">Stop</button><button class="btn btn-ghost btn-icon" aria-label="More: source, download, install"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></div></div></div>
<div class="cmp" style="margin: 0 8px 8px; flex-wrap: wrap; padding-left: 10px"><span class="t-muted" style="flex: 1 1 100%; padding-top: 8px">Ask anything</span><button class="btn btn-ghost btn-icon" aria-label="Attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button><button class="btn btn-ghost" style="padding: 0 6px; font-size: 13px; font-weight: 500">E4B · Mac</button><span style="flex: 1"></span><button class="btn btn-primary btn-icon" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>

<p class="t-small t-muted" style="margin: 12px 0 0; width: 320px">The title truncates; the full title is the heading's accessible name. Card buttons wrap: primary takes the full row. Model label shortens to the model's short name.</p>
</figure>

<figure style="margin: 0"><figcaption class="cap">200% text size</figcaption>
<div class="ph" style="font-size: 32px"><div style="height: 47px; flex: none"></div>
<header class="hd" style="height: auto; min-height: 56px; align-items: flex-start; padding-top: 4px"><button class="btn btn-ghost btn-icon" aria-label="Chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button><h2 style="font-size: 30px; white-space: normal; text-align: left; line-height: 1.2; padding: 4px 0">Moons of Jupiter</h2></header>

<div class="cmp" style="flex-wrap: wrap; padding: 8px 8px 8px 14px"><span class="t-muted" style="flex: 1 1 100%; font-size: 32px">Ask anything</span><button class="btn btn-ghost btn-icon" aria-label="Attach" style="width: 64px; height: 64px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width: 32px; height: 32px"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button><span style="flex: 1"></span><button class="btn btn-primary btn-icon" aria-label="Send" style="width: 64px; height: 64px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 32px; height: 32px"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
<div style="height: 34px; flex: none"></div></div>
<p class="t-small t-muted" style="margin: 12px 0 0; width: 390px">Everything is sized in rem: headings wrap instead of truncating, the model choice moves into the attach menu, the composer grows to two rows.</p>
</figure>

<figure style="margin: 0"><figcaption class="cap">Very long content</figcaption>
<div class="ph"><div style="height: 47px; flex: none"></div>
<header class="hd"><button class="btn btn-ghost btn-icon" aria-label="Chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button><h2>Notes for the science fair project about…</h2><span class="menu"></span></header>
<div class="body">
<div class="you" style="max-width: 92%"><p style="margin: 0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden">Here are my notes from the whole term. Week 1 we planted the beans in three cups, one by the window, one in the cupboard and one under the desk lamp. Week 2 the window one was 3 cm and the others were smaller. Week 3 the cupboard one went yellow and bent towards the door…</p><button class="btn btn-ghost" style="padding: 0; font-weight: 500; text-decoration: underline" aria-expanded="false">Show all · 2,400 characters</button></div>
<p style="margin: 0">Here's a summary table and the code for a growth chart:</p>
<pre role="region" aria-label="Code, scrolls sideways" tabindex="0" style="margin: 0; border: 1px solid #000; padding: 12px; overflow-x: auto; font: 13px/1.5 ui-monospace,Menlo,monospace; background: #f2f2f2">const heights = { window: [0, 3, 6.5, 9.8], cupboard: [0, 1.2, 2.1, 2.4] };
drawChart(heights, { title: "Bean height (cm)", weeks: 4 });</pre>
<div style="display: flex; gap: 8px"><button class="btn">Copy code</button></div>
</div>
<div style="height: 34px; flex: none"></div></div>
